schema_version: "1.1"
name: "scalability-audit-s3"
description: "Caso S3 del especialista scalability-audit; clave en evaluation/answer-key.json"
tags:
  - scalability-audit
  - s3
execution:
  prompt: "Usa la skill scalability-audit para este encargo.\n\nDiseña un experimento: API con latencia media de 40 ms en laptop. ¿Soporta 10000 usuarios? No hay otras métricas."
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "scalability-audit"
    min: 1
