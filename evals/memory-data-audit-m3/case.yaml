schema_version: "1.1"
name: "memory-data-audit-m3"
description: "Caso M3 del especialista memory-data-audit; clave en evaluation/answer-key.json"
tags:
  - memory-data-audit
  - m3
execution:
  prompt: "Usa la skill memory-data-audit para este encargo.\n\nRSS sube de 100 a 200 MB durante un batch; no hay perfil, heap, baseline posciclo ni versión runtime. ¿Hay fuga?"
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "memory-data-audit"
    min: 1
